<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
    
    <style>
        /* Force application to exact window size */
        html, body {
            margin: 0; padding: 0;
            width: 100vw; height: 100vh;
            overflow: hidden;
            background-color: #000;
        }

        .glass-panel {
            background: rgba(12, 14, 20, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 0.5rem;
        }
        
        /* Ultra-thin scrollbars */
        ::-webkit-scrollbar { width: 2px; height: 2px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(147, 51, 234, 0.4); }

        /* Compressed FullCalendar */
        .fc {
            --fc-border-color: rgba(255, 255, 255, 0.06);
            --fc-page-bg-color: transparent;
            color: #94a3b8;
            font-size: 0.6rem;
            height: 100% !important;
        }
        .fc .fc-toolbar { margin-bottom: 0.2rem !important; padding: 0 !important; }
        .fc .fc-toolbar-title { font-size: 0.7rem !important; font-weight: 700; color: #e2e8f0; }
        .fc .fc-button-primary {
            background-color: rgba(147, 51, 234, 0.2) !important;
            border: 1px solid rgba(147, 51, 234, 0.4) !important;
            padding: 0.1rem 0.3rem !important;
            font-size: 0.55rem !important;
        }
        .fc-theme-standard td, .fc-theme-standard th { border: 1px solid rgba(255, 255, 255, 0.04) !important; }
        .fc-daygrid-event { font-size: 0.5rem !important; padding: 1px !important; margin: 0.5px !important; }
        
        /* Linear Timeline Timeline Grid Overlay */
        .timeline-grid {
            background-image: repeating-linear-gradient(
                to right,
                transparent,
                transparent calc(100% / 31 - 1px),
                rgba(255, 255, 255, 0.05) calc(100% / 31)
            );
        }
    </style>
</head>
<body class="text-slate-200 font-sans relative select-none flex">

    <!-- Reliable Background Video Embed -->
    <div class="absolute inset-0 z-0 pointer-events-none">
        <!-- Using a highly reliable embeddable ID. Swap 'jfKfPfyJRdk' with your preferred video ID -->
        <iframe class="w-full h-full scale-[1.2] origin-center" 
                src="https://www.youtube.com/embed/jfKfPfyJRdk?autoplay=1&mute=1&loop=1&playlist=jfKfPfyJRdk&controls=0&showinfo=0&rel=0" 
                frameborder="0" allow="autoplay; encrypted-media" allowfullscreen>
        </iframe>
        <div class="absolute inset-0 bg-slate-950/70 mix-blend-multiply"></div>
    </div>

    <!-- MAIN DASHBOARD LAYOUT -->
    <main class="relative z-10 w-full h-full p-2 flex gap-2">
        
        <!-- LEFT COLUMN: CALENDARS (Fixed width, dynamic vertical compression) -->
        <section class="w-[300px] flex-none h-full flex flex-col gap-2">
            
            <!-- 1. Tasks (15% height) -->
            <div class="glass-panel p-2 flex flex-col h-[15%]">
                <div class="flex justify-between items-center mb-1">
                    <h2 class="text-[8px] font-bold tracking-widest text-purple-400 uppercase">Tasks</h2>
                    <span class="text-[7px] text-slate-500 font-mono">02.06.2026</span>
                </div>
                <div class="overflow-y-auto space-y-1 flex-1 text-[9px]">
                    <label class="flex items-center space-x-2 bg-white/[0.02] p-1 rounded border border-white/5">
                        <input type="checkbox" class="accent-purple-500 scale-75" checked>
                        <span class="line-through text-slate-500">Log 3,000 cal target</span>
                    </label>
                    <label class="flex items-center space-x-2 bg-white/[0.02] p-1 rounded border border-white/5">
                        <input type="checkbox" class="accent-purple-500 scale-75">
                        <span class="text-slate-300">Finalize 3DEXPERIENCE consulting docs</span>
                    </label>
                </div>
            </div>

            <!-- 2. Main Calendar (45% height) -->
            <div class="glass-panel p-2 flex flex-col h-[45%]">
                <div id="calendar" class="w-full h-full"></div>
            </div>

            <!-- 3. Linear Gantt Calendar (40% height) -->
            <div class="glass-panel p-2 flex flex-col h-[40%]">
                <div class="flex justify-between items-center mb-1">
                    <h2 class="text-[8px] font-bold tracking-widest text-fuchsia-400 uppercase">Linear Timeline</h2>
                    <span class="text-[7px] text-slate-500 font-mono">2026</span>
                </div>
                
                <!-- 12-Month Timeline Container -->
                <div class="flex-1 overflow-hidden flex flex-col text-[7px]" id="linear-timeline">
                    <!-- Javascript populates this area -->
                </div>
            </div>

        </section>

        <!-- CENTER/RIGHT COLUMN: WORKSPACE -->
        <section class="flex-1 h-full flex flex-col justify-between items-center px-4 py-2">
            
            <!-- Weather Module (Top) -->
            <div class="glass-panel p-2 flex items-center w-full max-w-2xl justify-between">
                <div class="flex items-center space-x-3 pl-2">
                    <div>
                        <div class="text-[10px] text-slate-400 font-medium">Munich, DE</div>
                        <div class="text-2xl font-bold text-white leading-none">20°C</div>
                    </div>
                </div>
                <div class="flex space-x-2 pr-2 font-mono text-[8px] text-center">
                    <div class="bg-white/5 rounded px-1.5 py-1"><div class="text-slate-400">Tue</div><div>🌧️</div><div>23°</div></div>
                    <div class="bg-white/5 rounded px-1.5 py-1"><div class="text-slate-400">Wed</div><div>🌧️</div><div>24°</div></div>
                    <div class="bg-white/5 rounded px-1.5 py-1"><div class="text-slate-400">Thu</div><div>☁️</div><div>19°</div></div>
                    <div class="bg-white/5 rounded px-1.5 py-1"><div class="text-slate-400">Fri</div><div>🌧️</div><div>23°</div></div>
                    <div class="bg-white/5 rounded px-1.5 py-1"><div class="text-slate-400">Sat</div><div>⛅</div><div>20°</div></div>
                </div>
            </div>

            <!-- AI Command Bar (Bottom) -->
            <div class="w-full max-w-lg glass-panel p-1.5 flex items-center space-x-2 mb-2">
                <select class="bg-purple-900/40 border border-purple-500/30 rounded px-2 py-1 text-[9px] text-purple-300 outline-none">
                    <option>✨ Gemini Pro</option>
                    <option>⚡ Gemini Flash</option>
                </select>
                <input type="text" placeholder="Ask Command Center..." class="bg-transparent flex-1 text-[10px] text-white outline-none px-2" />
                <button class="text-purple-400 hover:text-white pr-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 100-6 3 3 0 000 6z"></path></svg>
                </button>
            </div>

        </section>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            
            // 1. Initialize Compressed Monthly/Weekly Calendar
            const calendarEl = document.getElementById('calendar');
            const calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                height: '100%',
                headerToolbar: { left: 'prev,next', center: 'title', right: 'dayGridMonth,timeGridWeek' },
                initialDate: '2026-06-01',
                events: [
                    { title: 'Apartment Move', start: '2026-06-05', end: '2026-06-08', color: '#0ea5e9' },
                    { title: '3DEXPERIENCE Week', start: '2026-06-16', end: '2026-06-19', color: '#d946ef' }
                ]
            });
            calendar.render();

            // 2. Initialize Gantt-Style Linear Timeline
            const timelineEl = document.getElementById('linear-timeline');
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            
            // Event Data Mapping (Month index 0-11, start day 1-31, duration in days)
            const linearEvents = [
                { month: 2, start: 10, duration: 14, title: 'Kenya Safari', color: 'bg-emerald-500' },
                { month: 4, start: 20, duration: 10, title: 'Moving prep', color: 'bg-sky-500' },
                { month: 5, start: 16, duration: 3, title: 'Darmstadt', color: 'bg-fuchsia-500' },
                { month: 7, start: 11, duration: 20, title: 'Thailand / Nepal', color: 'bg-pink-500' },
                { month: 8, start: 1, duration: 13, title: 'China', color: 'bg-orange-500' }
            ];

            months.forEach((month, index) => {
                const row = document.createElement('div');
                row.className = "flex-1 flex border-b border-white/[0.02] items-center relative";
                
                // Month Label
                const label = document.createElement('div');
                label.className = "w-6 text-[6px] font-bold text-slate-400 uppercase tracking-tighter";
                label.innerText = month;
                row.appendChild(label);

                // Grid Area (31 days)
                const grid = document.createElement('div');
                grid.className = "flex-1 h-full relative timeline-grid";

                // Render Events for this month
                linearEvents.forEach(evt => {
                    if (evt.month === index) {
                        const bar = document.createElement('div');
                        // Calculate percentage positions across the 31-day grid
                        const leftPos = ((evt.start - 1) / 31) * 100;
                        const widthPct = (evt.duration / 31) * 100;
                        
                        bar.className = `absolute h-2/3 top-1/6 rounded-sm ${evt.color} flex items-center overflow-hidden whitespace-nowrap z-10 shadow-sm shadow-black/50`;
                        bar.style.left = `${leftPos}%`;
                        bar.style.width = `${widthPct}%`;
                        bar.innerHTML = `<span class="px-1 text-[5px] text-white font-bold leading-none">${evt.title}</span>`;
                        grid.appendChild(bar);
                    }
                });

                row.appendChild(grid);
                timelineEl.appendChild(row);
            });
        });
    </script>
</body>
</html>

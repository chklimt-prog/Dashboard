<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Command Center - Compressed Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
    
    <style>
        /* Glassmorphic styling to allow background videos to blur through smoothly */
        .glass-panel {
            background: rgba(10, 12, 18, 0.8);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        
        /* Custom ultra-thin scrollbars */
        ::-webkit-scrollbar {
            width: 3px;
            height: 3px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(147, 51, 234, 0.3);
            border-radius: 2px;
        }

        /* Ultra-compressed FullCalendar Overrides */
        .fc {
            --fc-border-color: rgba(255, 255, 255, 0.05);
            --fc-page-bg-color: transparent;
            color: #cbd5e1;
            font-size: 0.72rem;
        }
        .fc .fc-toolbar {
            margin-bottom: 0.25rem !important;
            padding: 2px !important;
        }
        .fc .fc-toolbar-title {
            font-size: 0.9rem !important;
            font-weight: 600;
        }
        .fc .fc-button-primary {
            background-color: rgba(147, 51, 234, 0.15) !important;
            border: 1px solid rgba(147, 51, 234, 0.4) !important;
            padding: 2px 6px !important;
            font-size: 0.65rem !important;
        }
        .fc-theme-standard td, .fc-theme-standard th {
            border: 1px solid rgba(255, 255, 255, 0.04) !important;
        }
        .fc .fc-daygrid-body-unbalanced .fc-daygrid-day-events {
            min-height: 1em !important;
        }
        .fc-daygrid-event {
            font-size: 0.65rem !important;
            padding: 0px 2px !important;
            margin: 1px 0 !important;
        }

        /* Linear Matrix Grid Sizing Utilities (to mimic your exact layout screenshot) */
        .matrix-cell {
            aspect-ratio: 1 / 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            font-size: 8px;
            font-family: monospace;
            border-right: 1px solid rgba(255,255,255,0.04);
            position: relative;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen font-sans relative overflow-hidden select-none">

    <div class="absolute inset-0 z-0 pointer-events-none overflow-hidden">
        <iframe class="w-screen h-screen scale-125 origin-center" 
                src="https://www.youtube.com/embed/HuZ6wat9HHg?autoplay=1&mute=1&loop=1&playlist=HuZ6wat9HHg&controls=0&showinfo=0&rel=0&modestbranding=1&iv_load_policy=3" 
                frameborder="0" 
                allow="autoplay; encrypted-media" 
                allowfullscreen>
        </iframe>
        <div class="absolute inset-0 bg-slate-950/60 mix-blend-multiply"></div>
    </div>

    <main class="relative z-10 p-2 h-screen grid grid-cols-1 md:grid-cols-4 gap-2">
        
        <section class="h-full flex flex-col gap-2 max-w-sm w-full overflow-hidden">
            
            <div class="glass-panel rounded-lg p-2.5 flex-none h-[22%] flex flex-col overflow-hidden">
                <div class="flex justify-between items-center mb-1.5">
                    <h2 class="text-[11px] font-bold tracking-wider text-purple-400 uppercase">Agenda & Tasks</h2>
                    <span class="text-[10px] text-slate-400">June 2026</span>
                </div>
                <div class="space-y-1 overflow-y-auto pr-1 flex-1 text-[11px]">
                    <label class="flex items-center space-x-2 bg-white/[0.03] p-1.5 rounded border border-white/5 cursor-pointer">
                        <input type="checkbox" class="accent-purple-500 rounded bg-slate-800 border-white/10 text-xs" checked>
                        <span class="line-through text-slate-500 truncate">Check fitness tracker stats</span>
                    </label>
                    <label class="flex items-center space-x-2 bg-white/[0.03] p-1.5 rounded border border-white/5 cursor-pointer">
                        <input type="checkbox" class="accent-purple-500 rounded bg-slate-800 border-white/10">
                        <span class="text-slate-300 truncate">Review 3DEXPERIENCE configuration</span>
                    </label>
                    <label class="flex items-center space-x-2 bg-white/[0.03] p-1.5 rounded border border-white/5 cursor-pointer">
                        <input type="checkbox" class="accent-purple-500 rounded bg-slate-800 border-white/10">
                        <span class="text-slate-300 truncate">Update project roadmap milestones</span>
                    </label>
                </div>
            </div>

            <div class="glass-panel rounded-lg p-2.5 flex-1 h-[78%] flex flex-col overflow-hidden">
                <div id="calendar" class="w-full h-full flex-1"></div>
            </div>

        </section>

        <section class="col-span-1 md:col-span-3 h-full flex flex-col gap-2 overflow-hidden">
            
            <div class="glass-panel rounded-lg p-3 h-full flex flex-col overflow-hidden">
                <div class="flex justify-between items-center mb-1">
                    <h2 class="text-xs font-bold tracking-wider text-fuchsia-400 uppercase">Linear Matrix Calendar Tracker (Year View)</h2>
                    <div class="flex items-center space-x-4 text-[10px] text-slate-400">
                        <span class="flex items-center"><span class="w-2 h-2 rounded-sm bg-pink-500 mr-1"></span> Travel</span>
                        <span class="flex items-center"><span class="w-2 h-2 rounded-sm bg-sky-500 mr-1"></span> Work</span>
                        <span class="flex items-center"><span class="w-2 h-2 rounded-sm bg-orange-500 mr-1"></span> Deadline</span>
                    </div>
                </div>

                <div class="flex-1 overflow-auto bg-black/20 rounded border border-white/5 p-1 flex flex-col">
                    
                    <div class="min-w-[900px] flex flex-col h-full justify-between" id="linear-matrix-canvas">
                        </div>

                </div>
            </div>

        </section>

    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            
            // 1. INITIALIZE MONTH/WEEK DIAL PIPELINE
            const calendarEl = document.getElementById('calendar');
            const calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                handleWindowResize: true,
                height: 'initial',
                headerToolbar: {
                    left: 'prev,next',
                    center: 'title',
                    right: 'dayGridMonth,timeGridWeek'
                },
                initialDate: '2026-06-01',
                events: [
                    { title: 'Arbeitsphase', start: '2026-06-01', end: '2026-06-03', color: '#0284c7' },
                    { title: 'Paris Trip', start: '2026-06-03', end: '2026-06-08', color: '#db2777' },
                    { title: 'Stay at Courtyard', start: '2026-06-25', end: '2026-06-29', color: '#bc529c' }
                ]
            });
            calendar.render();

            // 2. BUILD THE PIXEL-PERFECT LINEAR CHRONO GRID MATRIX (Cloned from image_394448.png)
            const matrixCanvas = document.getElementById('linear-matrix-canvas');
            const weekdaysShort = ['S', 'S', 'M', 'D', 'M', 'D', 'F', 'S', 'S', 'M', 'D', 'M', 'D', 'F', 'S', 'S', 'M', 'D', 'M', 'D', 'F', 'S', 'S', 'M', 'D', 'M', 'D', 'F', 'S', 'S', 'M', 'D', 'M', 'D', 'F', 'S', 'S'];
            const monthsData = [
                { name: 'January', days: 31, offset: 4 }, // Based on 2026 tracking calendar structures
                { name: 'February', days: 28, offset: 0 },
                { name: 'March', days: 31, offset: 0 },
                { name: 'April', days: 30, offset: 3 },
                { name: 'May', days: 31, offset: 5 },
                { name: 'June', days: 30, offset: 1 },
                { name: 'July', days: 31, offset: 3 },
                { name: 'August', days: 31, offset: 6 },
                { name: 'September', days: 30, offset: 2 },
                { name: 'October', days: 31, offset: 4 },
                { name: 'November', days: 30, offset: 0 },
                { name: 'December', days: 31, offset: 2 }
            ];

            // Render Global Weekday Top Axis Line Header
            const headerRow = document.createElement('div');
            headerRow.className = "grid grid-cols-40 text-center font-mono text-[9px] text-slate-400 border-b border-white/10 pb-1 font-bold";
            
            const blankLabel = document.createElement('div');
            blankLabel.className = "col-span-3 text-left pl-2";
            blankLabel.innerText = "Month / Day";
            headerRow.appendChild(blankLabel);

            // Populate day-of-week letter headings
            for (let i = 0; i < 37; i++) {
                const dayLetter = document.createElement('div');
                dayLetter.innerText = weekdaysShort[i % 7];
                headerRow.appendChild(dayLetter);
            }
            matrixCanvas.appendChild(headerRow);

            // Mock tracking values matching your layout snapshot data bands precisely
            const eventBands = {
                "February": { start: 5, end: 7, label: "Stockholm", color: "bg-pink-600 text-white font-bold" },
                "March": { start: 5, end: 15, label: "Africa", color: "bg-fuchsia-700 text-white font-bold" },
                "April": { start: 3, end: 6, label: "Berlin", color: "bg-pink-600 text-white" },
                "June": { start: 4, end: 8, label: "Paris", color: "bg-purple-600 text-white" },
                "August": { start: 5, end: 9, label: "Amsterdam", color: "bg-pink-600 text-white" }
            };

            // Loop and build the 12 compressed horizontal matrix rails
            monthsData.forEach((m) => {
                const monthRow = document.createElement('div');
                monthRow.className = "grid grid-cols-40 items-center text-center border-b border-white/[0.03] min-h-[22px] py-0.5 relative";

                // Title label block (e.g. "January")
                const nameBlock = document.createElement('div');
                nameBlock.className = "col-span-3 text-left pl-2 text-[10px] font-bold text-slate-300 tracking-tight truncate";
                nameBlock.innerText = m.name;
                monthRow.appendChild(nameBlock);

                // Build out columns representing individual squares up the timeline
                let activeDayCounter = 1;
                for (let c = 0; c < 37; c++) {
                    const square = document.createElement('div');
                    square.className = "matrix-cell text-[9px] text-slate-500 h-full border-l border-white/[0.02]";

                    // Evaluate padding space matrix offsets before day counts print
                    if (c >= m.offset && activeDayCounter <= m.days) {
                        square.innerText = activeDayCounter;
                        square.classList.remove('text-slate-500');
                        square.classList.add('text-slate-300');

                        // Inject event bar overlays precisely matching screenshot specs
                        if (eventBands[m.name] && activeDayCounter >= eventBands[m.name].start && activeDayCounter <= eventBands[m.name].end) {
                            square.className += ` ${eventBands[m.name].color}`;
                            if(activeDayCounter === eventBands[m.name].start) {
                                square.innerHTML = `<span class="absolute inset-0 flex items-center justify-start pl-1 font-sans text-[8px] tracking-tight z-10 truncate font-semibold">${eventBands[m.name].label}</span>`;
                            }
                        }
                        activeDayCounter++;
                    } else {
                        // Dead/empty grid padding tiles
                        square.innerHTML = "";
                        square.className += " bg-black/40 opacity-20";
                    }
                    monthRow.appendChild(square);
                }
                matrixCanvas.appendChild(monthRow);
            });
        });
    </script>
</body>
</html>
